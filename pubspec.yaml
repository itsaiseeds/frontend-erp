name: frontend_erp
description: "SaiSeeds ERP - Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  shimmer: ^3.0.0
  toastification: ^3.0.3
  intl: ^0.19.0

  # State Management
  provider: ^6.1.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.2
  cookie_jar: ^4.0.8

  # Local Storage
  shared_preferences: ^2.2.2

  # Environment / Security
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  encrypt: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env.dev
    - .env.prod
    - assets/images/logo/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo/saiseeds-logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo/saiseeds-logo.png"
  min_sdk_android: 21
